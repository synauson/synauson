name: Bug report
description: Something in Synauson doesn't work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Report security problems privately instead, as SECURITY.md describes. Leave out
        license keys, tokens and anything from your calls you don't want public.
  - type: input
    id: version
    attributes:
      label: Version
      description: The server image tag, or the jsyn-natives version (and the jsyn version, if you use it).
      placeholder: "1.8.0"
    validations:
      required: true
  - type: dropdown
    id: runs-as
    attributes:
      label: How you run it
      options:
        - Server container image
        - Server binary under systemd
        - jsyn on Linux
        - jsyn on Windows
        - Other (say below)
    validations:
      required: true
  - type: textarea
    id: platform
    attributes:
      label: Platform
      description: Operating system and version, CPU model, and GStreamer version (`gst-inspect-1.0 --version`) for a native install or jsyn.
      placeholder: "Ubuntu 24.04, AMD EPYC 9B45, GStreamer 1.24.2"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Include the error's reason (the ErrorInfo reason over gRPC, or the start of the exception message in jsyn).
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The log of a run with `SYNAUSON_LOG_LEVEL=debug`, from startup to the problem.
      render: text
    validations:
      required: true
